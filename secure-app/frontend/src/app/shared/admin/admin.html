<div class="admin-container">
    <h2>Gestion des utilisateurs</h2>

    <table class="users-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Login</th>
                <th>Rôle</th>
            </tr>
        </thead>
        <tbody>
            <!-- Boucle d'abord : une ligne par utilisateur -->
            @for (u of getList(); track u.id) {
                <tr>
                    <td>{{ u.id }}</td>
                    <td>{{ u.login }}</td>
                    <td>{{ u.role }}</td>
                </tr>
            }

            <!-- Si la liste est vide, afficher un message dans une ligne -->
            @if (!getList() || getList().length === 0) {
                <tr>
                    <td colspan="3" class="status muted">Aucun utilisateur.</td>
                </tr>
            }
        </tbody>
    </table>
</div>
